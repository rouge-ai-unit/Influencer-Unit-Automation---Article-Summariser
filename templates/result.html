<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Summary Result</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    body {
      background-color: #202222;
    }
  </style>
</head>
<body class="text-white min-h-screen py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md mx-auto backdrop-blur-sm bg-[#2a2c2c] rounded-2xl shadow-2xl overflow-hidden md:max-w-2xl p-8 border border-gray-700">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">
        Summary Result
      </h1>
    </div>

    <div class="mb-6">
      <h2 class="text-sm font-medium text-gray-300 mb-2">Original URL</h2>
      <a href="{{ url }}" class="text-indigo-400 hover:text-indigo-300 break-all hover:underline" target="_blank">
        {{ url }}
      </a>
    </div>

    <div class="prose max-w-none">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-sm font-medium text-gray-300">Summary</h2>
        <button onclick="copySummary(this)"
          class="copy-button text-sm px-3 py-1 rounded-lg bg-gray-700 text-indigo-300 hover:bg-gray-600 transition duration-150 ease-in-out flex items-center gap-1">
          <i class="ri-file-copy-line"></i>
          <span>Copy</span>
        </button>
      </div>
      <div id="summary-content"
        class="bg-[#1f2121] rounded-xl p-6 text-gray-200 leading-relaxed shadow-inner border border-gray-600">
        {{ summary | safe }}
      </div>
    </div>

    <div class="mt-8">
      <a href="/"
        class="block text-center w-full py-3 px-6 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-medium shadow-lg hover:shadow-2xl transform hover:-translate-y-0.5 transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-400">
        Summarize Another URL
      </a>
    </div>
  </div>

  <script>
    function copySummary(button) {
      const summaryText = document.getElementById('summary-content').innerText;
      navigator.clipboard.writeText(summaryText).then(() => {
        const span = button.querySelector('span');
        const icon = button.querySelector('i');
        const originalText = span.innerText;
        const originalIcon = icon.className;

        span.innerText = 'Copied!';
        icon.className = 'ri-check-line';
        button.classList.remove('bg-gray-700', 'text-indigo-300');
        button.classList.add('bg-green-700', 'text-green-300');

        setTimeout(() => {
          span.innerText = originalText;
          icon.className = originalIcon;
          button.classList.remove('bg-green-700', 'text-green-300');
          button.classList.add('bg-gray-700', 'text-indigo-300');
        }, 2000);
      });
    }
  </script>
</body>
</html>
